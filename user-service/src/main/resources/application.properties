spring.application.name=user-service
server.port=8081

# ===============================
# PostgreSQL (this service's own database - see ../docker-compose.yml postgres-user)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Kafka (shared broker across all services - produces user-events only, no consumer here)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# JWT (must be byte-for-byte identical across every service that validates tokens -
# see docs/MICROSERVICES.md "Auth handling")
# ===============================
jwt.secret=your-super-secret-key-change-this-in-production
jwt.expiration=3600000
