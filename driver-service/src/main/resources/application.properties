spring.application.name=driver-service
server.port=8082

# ===============================
# PostgreSQL (this service's own database - see ../docker-compose.yml postgres-driver,
# mapped to host port 5433 since 5432 is already claimed by postgres-user)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/driver_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Redis
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# ===============================
# Kafka (shared broker across all services)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=driver-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.simon.application.event

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# JWT (must be byte-for-byte identical across every service that validates tokens -
# see docs/MICROSERVICES.md "Auth handling")
# ===============================
jwt.secret=your-super-secret-key-change-this-in-production
jwt.expiration=3600000
