spring.application.name=api-gateway
server.port=8080

# ===============================
# Routing - pure reverse proxy, no JWT validation here (see docs/MICROSERVICES.md
# "Auth handling"). Each route's target port matches that service's own
# application.properties server.port.
# ===============================

# user-service (auth + user management)
spring.cloud.gateway.routes[0].id=user-service-auth
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=user-service-users
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**

# driver-service
spring.cloud.gateway.routes[2].id=driver-service
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/drivers/**

# order-service
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=http://localhost:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/orders/**

# delivery-service
spring.cloud.gateway.routes[4].id=delivery-service
spring.cloud.gateway.routes[4].uri=http://localhost:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/deliveries/**

# ===============================
# Logging
# ===============================
logging.level.org.springframework.cloud.gateway=INFO
