spring.application.name=delivery-service
server.port=8084

# ===============================
# PostgreSQL (this service's own database - see ../docker-compose.yml postgres-delivery,
# mapped to host port 5435 since 5432/5433/5434 are already claimed)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5435/delivery_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Redis
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# ===============================
# Kafka (shared broker across all services - produces delivery-events only)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# Upstream services (synchronous internal calls)
# ===============================
order-service.base-url=http://localhost:8083
driver-service.base-url=http://localhost:8082

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# JWT (must be byte-for-byte identical across every service that validates tokens -
# see docs/MICROSERVICES.md "Auth handling")
# ===============================
jwt.secret=your-super-secret-key-change-this-in-production
jwt.expiration=3600000
